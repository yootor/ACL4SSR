# Nextin + Mihomo subscription template
# Nextin template and Yootor_config.toml.
# Rule data source: MetaCubeX/meta-rules-dat (GPL-3.0).

x-nextin:
  version: 1
  mode: subscription-template
  name: Yootor_Nextin

proxies: []
proxy-groups:
# 主节点选择
- name: 🚀 Select
  type: select
  include-all-proxies: true
  exclude-filter: (?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)
  proxies:
  - 🎊 🇭🇰 HongKong
  - ☘️ 🇸🇬 Singapore
  - 🌎 🇺🇸 USA
  - DIRECT
# AI + Google 合并组
- name: 🤖 GG
  type: select
  include-all-proxies: true
  filter: (?i)(Singapore|新加坡|SG|狮|🇸🇬|美|US|🇺🇸|台|新北|彰化|Taiwan|🇨🇳|TW)
  exclude-filter: (?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)
  proxies:
  - 🚀 Select
  - ☘️ 🇸🇬 Singapore
  - 🌎 🇺🇸 USA
# 流媒体
- name: 📺 Media
  type: select
  include-all-proxies: true
  filter: .*
  exclude-filter: (?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)
  proxies:
  - 🚀 Select
  - 🎊 🇭🇰 HongKong
  - ☘️ 🇸🇬 Singapore
  - 🌎 🇺🇸 USA
# 微软服务
- name: ✨ Microsoft
  type: select
  include-all-proxies: true
  filter: (?i)(Singapore|新加坡|SG|狮|🇸🇬|美|US|🇺🇸|台|新北|彰化|Taiwan|🇨🇳|TW|香港|HK|🇭🇰|Hong Kong|HongKong|hongkong)
  exclude-filter: (?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)
  proxies:
  - 🚀 Select
  - 🎊 🇭🇰 HongKong
  - ☘️ 🇸🇬 Singapore
  - 🌎 🇺🇸 USA
  - DIRECT
# 苹果服务
- name: 🍎 Apple
  type: select
  proxies:
  - DIRECT
  - 🚀 Select
  - 🎊 🇭🇰 HongKong
  - 🌎 🇺🇸 USA
# 全球直连
- name: 🎯 Direct
  type: select
  proxies:
  - DIRECT
  - 🚀 Select
# 广告拦截
- name: 🍃 AdBlock
  type: select
  proxies:
  - REJECT
  - DIRECT
# 漏网之鱼
- name: 🐳 Final
  type: select
  include-all-proxies: true
  filter: .*
  exclude-filter: (?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)
  proxies:
  - 🚀 Select
  - DIRECT
  - 🎊 🇭🇰 HongKong
  - ☘️ 🇸🇬 Singapore
  - 🌎 🇺🇸 USA
# 香港自动测速
- name: 🎊 🇭🇰 HongKong
  type: url-test
  include-all-proxies: true
  filter: (?i)(港|HK|hk|Hong Kong|HongKong|hongkong)
  exclude-filter: (?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)
  url: https://cp.cloudflare.com/generate_204
  interval: 500
  tolerance: 50
# 新加坡自动测速
- name: ☘️ 🇸🇬 Singapore
  type: url-test
  include-all-proxies: true
  filter: (?i)(新加坡|SG|狮|🇸🇬|Singapore)
  exclude-filter: (?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)
  url: https://cp.cloudflare.com/generate_204
  interval: 500
  tolerance: 50
# 美国自动测速
- name: 🌎 🇺🇸 USA
  type: url-test
  include-all-proxies: true
  filter: (?i)(美国|🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)
  exclude-filter: (?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)
  url: https://cp.cloudflare.com/generate_204
  interval: 500
  tolerance: 50

rule-providers:
  MyCN:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/MyCN.list

  MyProxy:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/MyProxy.list

  AdBlock:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Mrs/AdBlock.mrs

  AI:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/AI.list

  Google:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/Google.list

  Media:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/ProxyMedia.list

  Microsoft:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/Microsoft.list

  Apple:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/Apple.list

  ProxyGFW:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Mrs/ProxyGFW.mrs

 ProxyDNS:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/ProxyDNS.list

  ChinaDomain:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/ChinaDomain.list

rules:
  - RULE-SET,MyCN,🎯 Direct
  - RULE-SET,MyProxy,🚀 Select
  - RULE-SET,AdBlock,🍃 AdBlock
  - RULE-SET,AI,🤖 GG
  - RULE-SET,Google,🤖 GG
  - RULE-SET,Media,📺 Media
  - RULE-SET,Microsoft,✨ Microsoft
  - RULE-SET,ProxyGFW,🚀 Select
  - RULE-SET,ProxyDNS,🎊 🇭🇰 HongKong
  - RULE-SET,Apple,🍎 Apple
  - RULE-SET,ChinaDomain,🎯 Direct
  - GEOIP,CN,🎯 Direct
  - MATCH,🐳 Final
