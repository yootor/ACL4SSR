# ============================================
# yootor.toml
#用户自定义策略组与规则集重构
# ============================================

# ============================================
# 规则集 (rule_sets)
# ============================================

[[rule_sets]]
group = "🎯 Direct"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/MyCN.list"
type = "rule-set"

[[rule_sets]]
group = "🚀 Select"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/MyProxy.list"
type = "rule-set"

[[rule_sets]]
group = "🍃 AdBlock"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Mrs/AdBlock.mrs"
type = "rule-set"

[[rule_sets]]
group = "🤖 GG"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/AI.list"
type = "rule-set"

[[rule_sets]]
group = "🤖 GG"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/Google.list"
type = "rule-set"

[[rule_sets]]
group = "📺 Media"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/ProxyMedia.list"
type = "rule-set"

[[rule_sets]]
group = "✨ Microsoft"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/Microsoft.list"
type = "rule-set"

[[rule_sets]]
group = "🚀 Select"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Mrs/ProxyGFW.mrs"
type = "rule-set"

[[rule_sets]]
group = "🎊 🇭🇰 HongKong"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/ProxyDNS.list"
type = "rule-set"

[[rule_sets]]
group = "🍎 Apple"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/Apple.list"
type = "rule-set"

[[rule_sets]]
group = "🎯 Direct"
url = "https://raw.githubusercontent.com/yootor/ACL4SSR/master/Clash/Rules/ChinaDomain.list"
type = "rule-set"

# GeoIP CN 兜底
[[rule_sets]]
group = "🎯 Direct"
type = "geoip"
value = "CN"

# Final 兜底
[[rule_sets]]
group = "🐳 Final"
type = "final"

# ============================================
# 代理组 (proxy_groups)
# ============================================

# 主节点选择
[[proxy_groups]]
name = "🚀 Select"
type = "select"
regex = ".*"
proxies = ["🎊 🇭🇰 HongKong", "☘️ 🇸🇬 Singapore", "🌎 🇺🇸 USA", "DIRECT"]

# AI + Google 合并组
[[proxy_groups]]
name = "🤖 GG"
type = "select"
regex = "(Singapore|新加坡|SG|狮|🇸🇬|美|US|🇺🇸|台|新北|彰化|Taiwan|🇨🇳|TW)"
proxies = ["🚀 Select", "☘️ 🇸🇬 Singapore", "🌎 🇺🇸 USA"]

# 流媒体
[[proxy_groups]]
name = "📺 Media"
type = "select"
regex = ".*"
proxies = ["🚀 Select", "🎊 🇭🇰 HongKong", "☘️ 🇸🇬 Singapore", "🌎 🇺🇸 USA"]

# 微软服务
[[proxy_groups]]
name = "✨ Microsoft"
type = "select"
regex = "(Singapore|新加坡|SG|狮|🇸🇬|美|US|🇺🇸|台|新北|彰化|Taiwan|🇨🇳|TW|香港|HK|🇭🇰|Hong Kong|HongKong|hongkong)"
proxies = ["🚀 Select", "🎊 🇭🇰 HongKong", "☘️ 🇸🇬 Singapore", "🌎 🇺🇸 USA", "DIRECT"]

# 苹果服务
[[proxy_groups]]
name = "🍎 Apple"
type = "select"
proxies = ["DIRECT", "🚀 Select", "🎊 🇭🇰 HongKong", "🌎 🇺🇸 USA"]

# 全球直连
[[proxy_groups]]
name = "🎯 Direct"
type = "select"
proxies = ["DIRECT", "🚀 Select"]

# 广告拦截
[[proxy_groups]]
name = "🍃 AdBlock"
type = "select"
proxies = ["REJECT", "DIRECT"]

# 漏网之鱼
[[proxy_groups]]
name = "🐳 Final"
type = "select"
regex = ".*"
proxies = ["🚀 Select", "DIRECT", "🎊 🇭🇰 HongKong", "☘️ 🇸🇬 Singapore", "🌎 🇺🇸 USA"]

# 香港自动测速
[[proxy_groups]]
name = "🎊 🇭🇰 HongKong"
type = "url-test"
regex = "(港|HK|hk|Hong Kong|HongKong|hongkong)"
url = "https://cp.cloudflare.com/generate_204"
interval = 500
tolerance = 50

# 新加坡自动测速
[[proxy_groups]]
name = "☘️ 🇸🇬 Singapore"
type = "url-test"
regex = "(新加坡|SG|狮|🇸🇬|Singapore)"
url = "https://cp.cloudflare.com/generate_204"
interval = 500
tolerance = 50

# 美国自动测速
[[proxy_groups]]
name = "🌎 🇺🇸 USA"
type = "url-test"
regex = "(美国|🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)"
url = "https://cp.cloudflare.com/generate_204"
interval = 500
tolerance = 50